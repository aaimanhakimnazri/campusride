<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="View, filter and cancel your CampusRide bookings.">
  <meta name="author" content="IMS566 Student">
  <title>My Bookings | CampusRide</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app-nav"></div>

  <main class="container">
    <header class="page-head d-flex flex-wrap justify-content-between align-items-end gap-2">
      <div><h1>My bookings</h1><p>Every ride you have booked, with its status.</p></div>
      <select id="statusF" class="form-select w-auto" aria-label="Filter by status">
        <option value="">All statuses</option><option>Confirmed</option><option>Completed</option><option>Cancelled</option>
      </select>
    </header>

    <section class="panel" aria-label="Bookings">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead><tr><th>Ref</th><th>Date</th><th>Route</th><th>Driver</th><th>Seats</th><th>Total</th><th>Status</th><th></th></tr></thead>
          <tbody id="bookBody"></tbody>
        </table>
      </div>
      <p id="empty" class="text-muted d-none mb-0">No bookings here yet. <a href="rides.html">Find a ride</a> to get started.</p>
    </section>

    <button class="btn btn-link text-muted mt-3 p-0" id="resetBtn">Reset demo bookings</button>
  </main>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (SRBS.requireLogin()) {
      SRBS.layout('bookings.html');
      const today = new Date(); today.setHours(0, 0, 0, 0);

      function render() {
        const f = document.getElementById('statusF').value;
        const rows = SRBS.getBookings().filter(b => !f || b.status === f).reverse();
        document.getElementById('bookBody').innerHTML = rows.map(b => {
          const r = SRBS.rideById(b.rideId); if (!r) return '';
          const canCancel = b.status === 'Confirmed' && r.date >= today;
          return '<tr><td>#' + String(b.id).padStart(4, '0') + '</td><td>' + SRBS.fmtDate(r.date) + '<small class="d-block text-muted">' + r.time + '</small></td>' +
            '<td class="route">' + SRBS.esc(r.from) + '<small>to ' + SRBS.esc(r.to) + '</small></td><td>' + SRBS.esc(r.driver) + '</td>' +
            '<td>' + b.seats + '</td><td>' + SRBS.rm(b.seats * r.price) + '</td>' +
            '<td><span class="badge-status st-' + b.status + '">' + b.status + '</span></td>' +
            '<td>' + (canCancel ? '<button class="btn btn-outline-danger btn-sm" data-id="' + b.id + '">Cancel</button>' : '') + '</td></tr>';
        }).join('');
        document.getElementById('empty').classList.toggle('d-none', rows.length > 0);
      }

      // Cancel a booking
      document.getElementById('bookBody').addEventListener('click', e => {
        const btn = e.target.closest('button[data-id]'); if (!btn) return;
        if (!confirm('Cancel this booking?')) return;
        const all = SRBS.getBookings();
        all.find(b => b.id === Number(btn.dataset.id)).status = 'Cancelled';
        SRBS.saveBookings(all); render();
        SRBS.toast('Booking cancelled.');
      });

      document.getElementById('resetBtn').addEventListener('click', () => { SRBS.resetData(); render(); SRBS.toast('Demo bookings reset.'); });
      document.getElementById('statusF').addEventListener('change', render);
      render();
    }
  </script>
</body>
</html>
