<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Meet the CampusRide drivers: vehicles, ratings and completed trips.">
  <meta name="author" content="IMS566 Student">
  <title>Drivers | CampusRide</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app-nav"></div>

  <main class="container">
    <header class="page-head">
      <h1>Drivers</h1>
      <p>Verified student drivers and the campus shuttle.</p>
    </header>

    <!-- Driver grid -->
    <section class="row g-3" id="driverGrid" aria-label="Driver list"></section>
  </main>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (SRBS.requireLogin()) {
      SRBS.layout('drivers.html');
      const today = new Date(); today.setHours(0, 0, 0, 0);

      document.getElementById('driverGrid').innerHTML = SRBS.drivers.map(d => {
        const initials = d.name.split(' ').map(w => w[0]).slice(0, 2).join('');
        const open = SRBS.rides.filter(r => r.driver === d.name && r.date >= today).length;
        return '<div class="col-md-6 col-lg-4"><article class="panel driver-card">' +
          '<div class="avatar" aria-hidden="true">' + initials + '</div>' +
          '<div><h2 class="h5 mb-1">' + SRBS.esc(d.name) + '</h2>' +
          '<p class="mb-1 rating">' + d.rating.toFixed(1) + ' / 5.0 rating</p>' +
          '<p class="mb-1">' + SRBS.esc(d.vehicle) + '</p>' +
          '<p class="mb-1 text-muted small">Plate ' + SRBS.esc(d.plate) + ' &middot; ' + d.type + '</p>' +
          '<p class="mb-0 small">' + d.trips + ' trips completed &middot; ' + open + ' upcoming rides</p></div></article></div>';
      }).join('');
    }
  </script>
</body>
</html>
