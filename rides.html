<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse and book available student rides from UiTM Kampus Machang to Machang town, Kota Bharu and the airport.">
  <meta name="author" content="IMS566 Student">
  <title>Find Rides | CampusRide</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app-nav"></div>

  <main class="container">
    <header class="page-head">
      <h1>Find rides</h1>
      <p>Pick a ride, choose your seats and confirm.</p>
    </header>

    <!-- Filters -->
    <section class="panel mb-3" aria-label="Filters">
      <div class="row g-2">
        <div class="col-md-6"><label class="form-label" for="q">Search</label><input id="q" class="form-control" placeholder="Kolej (TAR, TR, THO, DO, TDM), place or driver"></div>
        <div class="col-6 col-md-3"><label class="form-label" for="typeF">Ride type</label>
          <select id="typeF" class="form-select"><option value="">All types</option><option>Carpool</option><option>Shuttle</option><option>Motorbike</option></select></div>
        <div class="col-6 col-md-3"><label class="form-label" for="sortF">Sort by</label>
          <select id="sortF" class="form-select"><option value="date">Date</option><option value="price">Lowest price</option></select></div>
      </div>
    </section>

    <!-- Rides table -->
    <section class="panel" aria-label="Available rides">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead><tr><th>Date</th><th>Route</th><th>Driver</th><th>Type</th><th>Seats left</th><th>Price / seat</th><th></th></tr></thead>
          <tbody id="rideBody"></tbody>
        </table>
      </div>
      <p id="empty" class="text-muted d-none mb-0">No rides match your filters. Clear the search to see all rides.</p>
    </section>
  </main>

  <!-- Booking modal -->
  <div class="modal fade" id="bookModal" tabindex="-1" aria-labelledby="bookTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h2 class="modal-title h5" id="bookTitle">Confirm booking</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body">
        <p id="bookInfo" class="mb-3"></p>
        <label for="seatSel" class="form-label">Number of seats</label>
        <select id="seatSel" class="form-select mb-3"></select>
        <p class="fw-semibold mb-0">Total: <span id="bookTotal"></span></p>
      </div>
      <div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="confirmBtn">Confirm booking</button></div>
    </div></div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (SRBS.requireLogin()) {
      SRBS.layout('rides.html');
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const modal = new bootstrap.Modal(document.getElementById('bookModal'));
      let selected = null;

      // Draw the table using current filters
      function render() {
        const q = document.getElementById('q').value.toLowerCase();
        const type = document.getElementById('typeF').value;
        const sort = document.getElementById('sortF').value;
        let list = SRBS.rides.filter(r => r.date >= today &&
          (!type || r.type === type) &&
          (r.from + ' ' + r.to + ' ' + r.driver).toLowerCase().includes(q));
        list.sort(sort === 'price' ? (a, b) => a.price - b.price : (a, b) => a.date - b.date || a.time.localeCompare(b.time));

        document.getElementById('rideBody').innerHTML = list.map(r => {
          const left = SRBS.seatsLeft(r);
          return '<tr><td>' + SRBS.fmtDate(r.date) + '<small class="d-block text-muted">' + r.time + '</small></td>' +
            '<td class="route">' + SRBS.esc(r.from) + '<small>to ' + SRBS.esc(r.to) + '</small></td>' +
            '<td>' + SRBS.esc(r.driver) + '</td><td>' + r.type + '</td>' +
            '<td>' + (left > 0 ? left : '<span class="text-danger">Full</span>') + '</td><td>' + SRBS.rm(r.price) + '</td>' +
            '<td><button class="btn btn-primary btn-sm" data-id="' + r.id + '"' + (left > 0 ? '' : ' disabled') + '>Book</button></td></tr>';
        }).join('');
        document.getElementById('empty').classList.toggle('d-none', list.length > 0);
      }

      // Update modal total when seat count changes
      const updateTotal = () => { document.getElementById('bookTotal').textContent = SRBS.rm(selected.price * document.getElementById('seatSel').value); };

      // Open modal
      document.getElementById('rideBody').addEventListener('click', e => {
        const btn = e.target.closest('button[data-id]'); if (!btn) return;
        selected = SRBS.rideById(Number(btn.dataset.id));
        const max = Math.min(3, SRBS.seatsLeft(selected));
        document.getElementById('seatSel').innerHTML = Array.from({ length: max }, (_, i) => '<option>' + (i + 1) + '</option>').join('');
        document.getElementById('bookInfo').textContent = selected.from + ' to ' + selected.to + ', ' + SRBS.fmtDate(selected.date) + ' at ' + selected.time + ' with ' + selected.driver + '.';
        updateTotal(); modal.show();
      });
      document.getElementById('seatSel').addEventListener('change', updateTotal);

      // Confirm booking
      document.getElementById('confirmBtn').addEventListener('click', () => {
        const all = SRBS.getBookings();
        all.push({ id: Math.max(0, ...all.map(b => b.id)) + 1, rideId: selected.id, seats: Number(document.getElementById('seatSel').value), status: 'Confirmed' });
        SRBS.saveBookings(all);
        modal.hide(); render();
        SRBS.toast('Booked: ' + selected.from + ' to ' + selected.to + '. See it in My Bookings.');
      });

      ['q', 'typeF', 'sortF'].forEach(id => document.getElementById(id).addEventListener('input', render));
      render();
    }
  </script>
</body>
</html>
