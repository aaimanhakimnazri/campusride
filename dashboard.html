<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your CampusRide dashboard: upcoming rides, spending and booking activity.">
  <meta name="author" content="IMS566 Student">
  <title>Dashboard | CampusRide</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app-nav"></div>

  <main class="container">
    <header class="page-head">
      <h1>Dashboard</h1>
      <p>Your rides and spending at a glance.</p>
    </header>

    <!-- Summary cards -->
    <section class="row g-3 mb-3" aria-label="Summary">
      <div class="col-6 col-lg-3"><div class="panel stat"><div class="num" id="sUpcoming">0</div><div class="lbl">Upcoming rides</div></div></div>
      <div class="col-6 col-lg-3"><div class="panel stat alt"><div class="num" id="sSpent">RM 0</div><div class="lbl">Total spent</div></div></div>
      <div class="col-6 col-lg-3"><div class="panel stat"><div class="num" id="sCompleted">0</div><div class="lbl">Rides completed</div></div></div>
      <div class="col-6 col-lg-3"><div class="panel stat alt"><div class="num" id="sOpen">0</div><div class="lbl">Rides open to book</div></div></div>
    </section>

    <!-- Charts -->
    <section class="row g-3 mb-3" aria-label="Charts">
      <div class="col-lg-7">
        <div class="panel">
          <h2>Seats booked by destination</h2>
          <div class="chart-box"><canvas id="destChart" aria-label="Bar chart of seats booked per destination" role="img"></canvas></div>
        </div>
      </div>
      <div class="col-lg-5">
        <div class="panel">
          <h2>Booking status</h2>
          <div class="chart-box"><canvas id="statusChart" aria-label="Doughnut chart of booking status" role="img"></canvas></div>
        </div>
      </div>
    </section>

    <!-- Next ride + recent -->
    <section class="row g-3" aria-label="Next ride">
      <div class="col-lg-5">
        <div class="panel">
          <h2>Your next ride</h2>
          <div id="nextRide"></div>
        </div>
      </div>
      <div class="col-lg-7">
        <div class="panel">
          <h2>Recent bookings</h2>
          <div class="table-responsive">
            <table class="table table-hover">
              <thead><tr><th>Date</th><th>Route</th><th>Total</th><th>Status</th></tr></thead>
              <tbody id="recentBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (SRBS.requireLogin()) {
      SRBS.layout('dashboard.html');

      const today = new Date(); today.setHours(0, 0, 0, 0);
      // Join each booking with its ride details
      const rows = SRBS.getBookings().map(b => ({ b, r: SRBS.rideById(b.rideId) })).filter(x => x.r);
      const active = rows.filter(x => x.b.status !== 'Cancelled');

      // Summary numbers
      const upcoming = rows.filter(x => x.b.status === 'Confirmed' && x.r.date >= today)
                           .sort((a, z) => a.r.date - z.r.date || a.r.time.localeCompare(z.r.time));
      document.getElementById('sUpcoming').textContent = upcoming.length;
      document.getElementById('sSpent').textContent = SRBS.rm(active.reduce((s, x) => s + x.b.seats * x.r.price, 0));
      document.getElementById('sCompleted').textContent = rows.filter(x => x.b.status === 'Completed').length;
      document.getElementById('sOpen').textContent = SRBS.rides.filter(r => r.date >= today && SRBS.seatsLeft(r) > 0).length;

      // Next ride panel
      const next = upcoming[0];
      document.getElementById('nextRide').innerHTML = next
        ? '<p class="route fs-5 mb-1">' + SRBS.esc(next.r.from) + ' to ' + SRBS.esc(next.r.to) + '</p>' +
          '<p class="mb-1">' + SRBS.fmtDate(next.r.date) + ' at ' + next.r.time + '</p>' +
          '<p class="text-muted mb-3">Driver: ' + SRBS.esc(next.r.driver) + ' (' + next.r.type + ')</p>' +
          '<a class="btn btn-primary btn-sm" href="bookings.html">Manage booking</a>'
        : '<p class="text-muted">No upcoming rides yet.</p><a class="btn btn-primary btn-sm" href="rides.html">Find a ride</a>';

      // Recent bookings (latest 5)
      document.getElementById('recentBody').innerHTML = rows.slice(-5).reverse().map(x =>
        '<tr><td>' + SRBS.fmtDate(x.r.date) + '</td><td>' + SRBS.esc(x.r.from) + ' to ' + SRBS.esc(x.r.to) +
        '</td><td>' + SRBS.rm(x.b.seats * x.r.price) + '</td><td><span class="badge-status st-' + x.b.status + '">' + x.b.status + '</span></td></tr>').join('');

      // Chart 1: seats booked per destination (from active bookings)
      const byDest = {};
      active.forEach(x => { byDest[x.r.to] = (byDest[x.r.to] || 0) + x.b.seats; });
      new Chart(document.getElementById('destChart'), {
        type: 'bar',
        data: { labels: Object.keys(byDest), datasets: [{ label: 'Seats booked', data: Object.values(byDest), backgroundColor: '#0F5C4D', borderRadius: 4 }] },
        options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
      });

      // Chart 2: booking status split
      const st = { Confirmed: 0, Completed: 0, Cancelled: 0 };
      rows.forEach(x => st[x.b.status]++);
      new Chart(document.getElementById('statusChart'), {
        type: 'doughnut',
        data: { labels: Object.keys(st), datasets: [{ data: Object.values(st), backgroundColor: ['#0F5C4D', '#F2B134', '#C9564B'] }] },
        options: { maintainAspectRatio: false, cutout: '62%', plugins: { legend: { position: 'bottom' } } }
      });
    }
  </script>
</body>
</html>
